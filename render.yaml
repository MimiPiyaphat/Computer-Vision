services:
  - type: web
    name: strokevision-ai
    runtime: python
    plan: free
    branch: main
    buildCommand: bash render-build.sh
    startCommand: python web_app.py --host 0.0.0.0
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: STROKEVISION_ACCESS_KEY
        sync: false
      - key: STROKEVISION_DATA_DIR
        value: /tmp/strokevision/features
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
